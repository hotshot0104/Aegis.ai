services:
  # 1. AEGIS-AI Backend (FastAPI + ML Perception + Multi-Agent DAG + WebSockets)
  aegis-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: aegis-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=["*"]
    volumes:
      - ./backend/models_saved:/app/backend/models_saved
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis-network

  # 2. AEGIS-AI SOC Command Center Dashboard (Next.js)
  aegis-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: aegis-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://aegis-backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws
    depends_on:
      aegis-backend:
        condition: service_healthy
    networks:
      - aegis-network

  # 3. Live Multi-Subnet IP Telemetry Generator Container
  aegis-traffic-generator:
    build:
      context: .
      dockerfile: docker/Dockerfile.generator
    container_name: aegis-traffic-generator
    environment:
      - BACKEND_URL=http://aegis-backend:8000
      - STREAM_INTERVAL=0.8
      - ATTACK_INTERVAL=15
    depends_on:
      aegis-backend:
        condition: service_healthy
    networks:
      - aegis-network

networks:
  aegis-network:
    driver: bridge
